name: Mantener Backend Despierto 24/7

on:
  schedule:
    # Se ejecuta cada 10 minutos para evitar que Render hiberne por inactividad
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping al backend en Render
        run: |
          curl -f -s -m 45 "https://laurent-backend.onrender.com/actuator/health" || true
