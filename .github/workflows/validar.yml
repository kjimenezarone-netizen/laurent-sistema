name: Verificar Laurent V5 (Integración)
on:
  pull_request:
  push:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run test:domain
      - run: node ../pruebas/revisar_sintaxis_ts.cjs
      - run: npm run build
  backend-y-flujos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laurent_test
          POSTGRES_USER: laurent_test
          POSTGRES_PASSWORD: clave_solo_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U laurent_test -d laurent_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar backend y ejecutar pruebas unitarias
        run: mvn -B -f backend/pom.xml test package
      - name: Iniciar API sobre PostgreSQL de pruebas
        env:
          DB_URL: jdbc:postgresql://localhost:5432/laurent_test
          DB_USER: laurent_test
          DB_PASSWORD: clave_solo_ci
          ADMIN_USERNAME: administrador_ci
          ADMIN_PASSWORD: SoloPruebasSeguras123456!
        run: |
          export JWT_SECRET="$(openssl rand -base64 48)"
          nohup java -jar backend/target/*.jar > backend-ci.log 2>&1 &
          echo $! > backend-ci.pid
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then exit 0; fi
            sleep 2
          done
          tail -150 backend-ci.log
          exit 1
      - name: Ejecutar prueba funcional integrada
        env:
          ADMIN_USERNAME: administrador_ci
          ADMIN_PASSWORD: SoloPruebasSeguras123456!
          LAURENT_API_URL: http://localhost:8080
        run: python3 pruebas/smoke_integracion.py
      - name: Mostrar errores del backend si falla
        if: failure()
        run: tail -200 backend-ci.log || true
  estructura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/verificar_integracion.py
      - name: Probar reglas Java puras
        run: |
          mkdir -p pruebas/build
          javac -encoding UTF-8 -d pruebas/build backend/src/main/java/com/laurent/clinica/dominio/ReglasAgenda.java pruebas/java/ReglasAgendaTest.java
          java -cp pruebas/build ReglasAgendaTest
          javac -encoding UTF-8 -d pruebas/build pruebas/java/SintaxisJavaTest.java
          java -cp pruebas/build SintaxisJavaTest
