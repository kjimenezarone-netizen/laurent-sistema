server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: laurent-sistema
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/laurent_db}
    username: ${DB_USER:laurent_app}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
jwt:
  secret: ${JWT_SECRET}
  expiration-hours: 8
bootstrap:
  admin-username: ${ADMIN_USERNAME:}
  admin-password: ${ADMIN_PASSWORD:}
  admin-name: ${ADMIN_NAME:Administrador Laurent}
laurent:
  storage-dir: ${LAURENT_STORAGE_DIR:./storage}
