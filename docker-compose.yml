version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: laurent-postgres
    environment:
      POSTGRES_DB: laurent_db
      POSTGRES_USER: laurent_dev
      POSTGRES_PASSWORD: laurentpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laurent_dev -d laurent_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
